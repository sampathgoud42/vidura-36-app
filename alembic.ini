# Schema migrations for vidura-36-app.
#
# Flyway is mandated by the rebuild brief but is a JVM tool with no SQLite
# support, and this is a Python project. Alembic does the job and is held to
# the same contract: a clean baseline, ordered versions, migrate-from-empty
# proven by a test, and adding a world never editing an existing migration.
#
#   .venv\Scripts\alembic upgrade head
#   .venv\Scripts\alembic -x url=sqlite:///./var/scratch.db upgrade head

[alembic]
script_location = backend/migrations
prepend_sys_path = backend
# Split prepend_sys_path on the OS separator rather than the legacy
# space/comma/colon guess, which mangles Windows paths containing a colon.
path_separator = os
# Version files sort by their filename, so the number leads.
file_template = %%(rev)s_%%(slug)s
# Empty: the URL comes from Settings (TBOT_DATABASE_PATH / _URL_OVERRIDE) or
# from -x url=... A URL written here is a URL that goes stale.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
